<!DOCTYPE html>
<html>
<head>
  <title>Form Validation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Registration Form</h2>
  <form onsubmit="return validateForm()">
    <label>Name:</label><br>
    <input type="text" id="name" placeholder="Enter your full name"><br><br>

    <label>Email:</label><br>
    <input type="text" id="email" placeholder="Enter your email address"><br><br>

    <label>Phone Number:</label><br>
    <input type="text" id="phone" placeholder="enter your phone number"><br><br>

    <label>Password:</label><br>
    <input type="password" id="password" placeholder="Enter a strong password"><br><br>

    <label>Confirm Password:</label><br>
    <input type="password" id="confirmPassword" placeholder="Re-enter password"><br><br>

    <input type="submit" value="Submit">
  </form>
</body>
  <script src="script.js" defer></script>
</html>
